name: Build ProdCollab

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # Forge bundles the Electron main process, renderer, preload, and server
      # resource, then creates the Windows Squirrel installer in frontend/out.
      - name: Build Windows installer
        run: npm run make

      - name: Upload Windows installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProdCollab-Windows-${{ github.sha }}
          path: frontend/out/make/**/*
          if-no-files-found: error
          retention-days: 14
